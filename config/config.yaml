# ============================================================
# Sales Forecast — Configuration
# Edit the values below. Lines starting with # are comments and
# are ignored — they are just notes explaining what each setting does.
# ============================================================

# --- Data source ---------------------------------------------------
# The database table that holds raw sales data.
source_table: "[salewarehouse].[dbo].[cube_Sale_APD]"

# --- Date range to pull/analyze -------------------------------------
# Format: YYYY-MM-DD
date_range:
  start: "2024-01-01"
  end: "2026-08-28"   # today's date; update as needed

# --- Reference files -------------------------------------------------
# Path to the price list file (relative to the project root).
pricelist_path: "reference/pricelist.xlsx"

# --- Pilot categories --------------------------------------------------
# Type-level values (not Category-level), confirmed against reference/pricelist.xlsx
# (Product Type column, visible sheets only) on 2026-08-31. Type level was chosen
# over Category level because Category would also pull in Fuse link, HRC fuse,
# Low Tension Fuse Switch and Fuse Holder — different products with different
# demand behaviour. See STATUS.md Locked Decisions for the full reasoning.
pilot_categories:
  fuse_cutout: "High Voltage Distribution Fuse Cutout"     # 10 items, from reference/pricelist.xlsx Product Type column
  surge_arrester: "Medium Voltage Surge Arrester"          # 58 items, from reference/pricelist.xlsx Product Type column

# --- Business unit / division -------------------------------------------------
# CORRECTED 2026-09-04 (see STATUS.md Locked Decisions, "Division source-of-truth
# correction"). SUPERSEDES this same day's earlier fix, which removed the
# `divisions_in_scope` list this section used to hold and replaced `division`
# with a single fixed value's exclusion rule (`excluded_division_suffix: "-OLD"`,
# now deleted, not just commented out). That fix addressed the SYMPTOM -- an
# unreliable database column -- rather than asking what the source of truth
# for a product's division actually is. It already is the pricelist. The
# corrected rule: **the pricelist is authoritative for which division a
# product belongs to; the database's own `division` column on cube_Sale_APD is
# reference-only and is NEVER used to filter which rows count as an item's
# sales.** PEM102 and PEM107 products carry each other's `-OLD` tags in a
# mirror pattern nobody can explain (STATUS.md Phase C step 1); excluding
# those rows, as the prior fix did, would have discarded roughly 26% of
# PEM102's and 40% of PEM107's real Omni-Channel sales value
# (output/summary/phaseC_sheetmap_report.md). Queries now select by itemcode +
# revenue_type only -- no `division = ...` clause anywhere, `-OLD` tags
# included, not excluded.
division_source: "pricelist"   # Explicit flag: division is attached from the
                                # pricelist sheet an item appears on, never read
                                # from or filtered by the database's `division`
                                # column. The database value is kept only as a
                                # reference column (division_db_raw) for
                                # inspecting discrepancies, never as a filter.

# Sheet name (exactly as it appears in reference/pricelist.xlsx) -> division
# name to record for every item found on that sheet. Confirmed against the
# pricelist's own `business` column, which matches this mapping exactly for
# all six sheets (output/summary/phaseC_sheetmap_report.md §1).
sheet_to_division:
  "PEM101-Version 2": "PEM101"    # pilot division -- Fuse/Surge Arrester exist only here
  "PEM102-Version 2": "PEM102"
  "PEM103-Version2": "PEM103"     # note: no space before "Version2" -- the visible sheet;
                                   # a similarly-named hidden sheet has a space (STATUS.md)
  "PEM104": "PEM104"              # in scope for product ID; excluded from FORECASTING only,
                                   # see divisions_excluded_from_forecasting below
  "PEM107 CT-Version 2": "PEM107"
  "CI101": "CI101"                # previously miscategorised as a candidate to drop as "a
                                   # separate company" -- it is in the pricelist, so it is in
                                   # scope. Its ~37% PEM101-tagged sales share is now included
                                   # automatically, since division is no longer a query filter.

# Divisions in scope for product identification but excluded from forecasting
# specifically. Confirmed by the user (2026-09-04). UNRELATED to the division
# source-of-truth correction above -- PEM104 stays excluded from forecasting
# for a data-volume reason (too few transactions to fit any model), not a
# division-tagging reason, and this decision is not reversed by that correction.
divisions_excluded_from_forecasting:
  PEM104: "Only 12 transactions across 17 months (STATUS.md Phase C step 1) --
    too few to fit any model at any aggregation level. Receives a placeholder
    forecast for Phase 4 (same principle as placeholder_item_codes below);
    codes recorded in reference/pricelist.xlsx (PEM104 sheet) and
    output/summary/phaseC_PEM104_item_codes.txt."

# Legacy scalar, kept only so any script not yet migrated to sheet_to_division
# keeps working unchanged -- this is the PILOT division, NOT a project-wide
# filter. Must NEVER be used as a `division = ...` clause in any query; see
# src/load_data_full.py, src/investigations/load_data.py and
# src/score_forward_test_v2.py for the corrected query pattern (itemcode +
# revenue_type only, division attached from sheet_to_division afterward).
division: "PEM101"

# --- Revenue type filter --------------------------------------------------
# Fixed to Omni Channel because this project's scope is the Omni Channel
# business unit; other channels are out of scope for forecasting.
revenue_type: "Omni Channel"

# --- Sales status basis --------------------------------------------------
# Actual plus MPS matches the Phase 1 convention.
status_basis:
  - "Actual"
  - "MPS"

# --- Pilot item codes --------------------------------------------------
# Specific item codes to use for initial testing.
pilot_item_codes:
  - "EEE-F-FC-1040010002"
  - "HS-F-99-02110"
  - "HS-F-99-0213"

# --- Moving-average windows to test (in months) -------------------------
moving_average_windows:
  - 3
  - 6
  - 12

# --- Backtesting ---------------------------------------------------------
# Number of months to hold out at the end of the series to test forecast
# accuracy against actual results.
backtest_holdout_months: 6

# --- Error metrics ---------------------------------------------------------
# Metrics used to score forecast accuracy.
# MAPE (Mean Absolute Percentage Error) is intentionally excluded:
# months with zero actual demand cause a division-by-zero in the MAPE
# formula, which makes it unreliable for this dataset.
error_metrics:
  - "MAE"   # Mean Absolute Error
  - "RMSE"  # Root Mean Squared Error
  - "Bias"  # Average signed error (over- vs under-forecasting)

# --- Phase 2 — forecasting method (locked 2026-09-02) -----------------------
# Combination forecasting: the arithmetic mean of the models listed below.
# Chosen because no single model won consistently at any level, and
# rule-based selection (SBC / Kostenko-Hyndman / Petropoulos-Kourentzes) did
# not beat this simple combination in backtesting. See STATUS.md Phase 2 for
# the full evidence.
forecast_method: "combination_mean"

# The models averaged into the combination forecast. Same six models used
# throughout backtesting (Naive baseline, then Moving Average, then Croston
# and SBA — see STATUS.md Locked Decisions for why TensorFlow/Prophet were
# excluded).
combination_models:
  - "Naive"
  - "MA3"
  - "MA6"
  - "MA12"
  - "Croston"
  - "SBA"

# Level at which the combination forecast is applied. Category/Type level,
# not item level: aggregation cut zero periods from 39.3% to 0% and the
# validation-to-test overfitting gap from 127% to under 4%.
forecast_level:
  - "category"
  - "type"

# Time bucket for the forecast. Monthly was tested against coarser buckets
# (2-month, quarterly, 6-month) at Category/Type level; those series already
# have 0% zero periods monthly, so coarsening would only discard data points
# for no benefit.
forecast_granularity: "monthly"

# --- Leakage guard (Task 2, 2026-09-04) -----------------------------------
# Refuses to score any backtest window (train/val/test or rolling-origin, src/backtest_rekeyed.py)
# whose test window's LAST month ends too close to the data's snapshot_pull_date. See
# src/leakage_guard.py for the check itself.
#
# Why this exists: output/summary/b4_leakage_and_windowposition_report.md found ZERO
# future-dated (forecast_date > pull_date) rows inside the existing 31-month backtest window --
# but only because that particular pull (2026-09-02) happened to land more than a month after the
# window's last month (2026-07) had fully elapsed. That gap was incidental, never enforced by any
# code, so a future re-run with a tighter pull-to-window-end gap could silently score an
# incomplete window without anyone noticing. This section makes the gap an explicit, checked
# precondition instead of an accident of timing.
#
# Default reasoning for min_margin_days (a stated, evidence-grounded choice, not an arbitrary
# number): this project's own order-notice-period evidence (STATUS.md Business Findings) shows a
# median 6-day gap between an order being placed and its contractual delivery date, and only 5.9%
# of orders give 30 or more days' notice. That means the overwhelming majority of orders destined
# for a given calendar month are already entered into the source system well within 30 days of
# that month's end. Requiring at least 30 days between a window's last month-end and the pull
# date is therefore the smallest margin that safely clears this project's monthly granularity
# while staying grounded in evidence already gathered, rather than picking a round number with no
# basis. (For reference: the actual gap in the current data pull is 33 days -- this default
# passes the real data by a deliberately narrow, evidence-based margin, not a wide arbitrary one.)
leakage_guard:
  min_margin_days: 30

# --- Adopted item-level forecasting method (Phase B, locked 2026-09-02/03) ------------------
# Recorded explicitly, not left to be inferred from filenames, so a consistency check
# (src/score_forward_test_v2.py) can verify a forward-test log matches the CURRENT adopted
# method/series key before scoring it -- refusing to silently score a log built under a
# different key or approach (e.g. the pre-2026-09-04 58-item createDate log, archived under
# output/summary/archive/). See STATUS.md Phase B1 (re-keying recommendation) and Phase B3
# (Top-down aggregation choice) for the evidence behind each value below.
adopted_series_key: "forecastDate"        # monthly series keyed on forecast_date (contractual
                                           # delivery date), not createDate -- Phase B1's
                                           # recommendation. Matches the "{key}" suffix on
                                           # output/data/processed_full_category_sales_monthly_{key}.csv.
adopted_item_level_approach: "Top-down"   # Type-level Combination forecast, allocated to each
                                           # item by its historical qty share of the Type over the
                                           # fitting window -- src/item_level_reconciliation.py's
                                           # forecast_all_approaches "Top-down" branch. Phase B3
                                           # found no approach statistically beats another overall,
                                           # but Top-down had the best point estimate and is the
                                           # given instruction for this log rebuild (not
                                           # re-litigated here -- see STATUS.md Phase B3).
adopted_scope_file: "output/summary/part1_category_scope_all_codes.csv"  # current 128-item
                                           # Category scope (Fuse + Surge Arrester, 8 Types, 2
                                           # Categories) -- the set of codes any current forward-
                                           # test log must match.

# --- Final forecasting method (Phase B closeout, locked 2026-09-04) -------------------------
# What "Top-down combination" means end to end: fit the six-model combination (combination_models
# above) at TYPE level, then allocate each Type's forecast to its member items by each item's
# historical qty share of the Type over the fitting window. Combines forecast_level (Category/
# Type fitting), combination_models (the six base models averaged) and adopted_item_level_approach
# (the allocation rule) into one named value so a reader does not have to reconstruct "the final
# method" from three separate keys. See STATUS.md Locked Decisions, "Final forecasting method:
# Top-down combination (2026-09-04)" for the evidence (Phase B3, Modeler tasks 1-3).
forecast_method_final: "topdown_combination"

# --- Evaluation policy (Phase B closeout, locked 2026-09-04) ---------------------------------
# Rolling-origin (all 7 origins pooled, src/backtest_rekeyed.py run_rolling_origin) is PRIMARY.
# The single train/validation/test split (19/6/6 months) is SECONDARY only. Reason: Task 1
# (2026-09-04, STATUS.md Modeler-tasks-1-3 log entry) found the final train/val/test window
# (origin 7, Feb-Jul 2026) behaves anomalously -- the createDate-vs-forecast_date reversal
# persists at every level tested and is NOT explained by the dominant focus item alone, cause
# still unresolved -- so a single window already flagged as unrepresentative must not be the
# primary basis for locking in a method or reporting its accuracy.
evaluation_policy:
  primary: "rolling_origin"
  secondary: "train_val_test"

# --- Cross-division demand scope (Phase B closeout, locked 2026-09-04) -----------------------
# Keep the Omni Channel / division=PEM101 scope as-is (no config change to the filters above).
# Under this project's actual channel/status filter, demand excluded by the division filter is
# only 2.96 million THB (0.42% of the 128-item scope total) -- small enough to document as a
# known exclusion rather than model. The much larger historical figure (60.6M / 14.3%, ignoring
# channel) was found on 2026-09-04 to be mostly Tendering-channel sales of EEE-F-FC-1040010002
# through division PPS -- outside this project's Omni Channel scope by design. See STATUS.md
# Locked Decisions for the full method comparison (Method A vs Method B) and the open question
# (queued for Warehouse/Operations) of whether that Tendering demand shares physical stock with
# this project's items.
cross_division_excluded_value_thb: 2960000   # Method B (channel/status held fixed) -- see STATUS.md
cross_division_excluded_pct: 0.42

