# ============================================================
# Phase E1 assumptions (single Modeler, 2026-09-18) -- SCENARIO INPUTS, NOT FACTS.
# Scope: PEM101 128-item pilot (adopted_scope_file above). This is a BOUNDED SCENARIO PILOT --
# it produces NO actionable purchase recommendation, only a scenario analysis the business can
# evaluate. Every key below carries an `owner` (who should confirm/own the value) and is
# explicitly a modelling/scenario input, never a measured fact, unless the comment says the
# figure itself is business-confirmed (lead time only). See docs/reports/summary/phaseE1_modeler_report.md
# for the full reasoning behind each value and every acceptance-criteria self-check.
# ============================================================
phase_e1_assumptions:

  # --- Procurement lead time (business figure, STATUS.md Section 8.1: "45-60 days ... reaffirmed
  # 2026-09-04 ... configurable per item"). No per-item override exists in this codebase, so the
  # SAME grid is applied to every item -- that uniform application is itself a stated
  # simplification (owner: Modeler default), not a business-confirmed per-item schedule. 75 days
  # extends one point beyond the confirmed 45-60 range as a sensitivity/stress point.
  # ROBUST DEFAULT (Phase J Part 4, 2026-09-23): set to the UPPER BOUND of the business-confirmed
  # 45-60 day range, not the middle -- under-provisioning costs more than over-provisioning when
  # customer orders arrive with a median 6 days' notice (STATUS.md Business Findings), and Phase I
  # (output/summary/phaseI_report.md) found procurement lead time DECISION-RELEVANT in every
  # division (max value_shift 20.8-28.4%, already relevant at the very first alternative tested).
  # Numerically unchanged from the prior "middle of 45-60" default (60 was already the grid's
  # middle value AND the range's upper bound at the same time -- the prior comment was imprecise,
  # not the number) -- corrected here for a robust-defaults reason, not a robust-defaults change.
  procurement_lead_time_days_grid: [45, 60, 75]
  procurement_lead_time_days_owner: "business (45 and 60 confirmed, STATUS.md Section 8.1); 75 is a Modeler-added sensitivity point beyond the confirmed range, owner Modeler default"
  procurement_lead_time_days_default: 60   # upper end of the confirmed 45-60 day range (robust default, Phase J Part 4 -- see comment above)

  # --- Assembly time: STATUS.md confirms this is a genuine, UNRESOLVED business gap -- no field
  # in any table links a raw-material consumption event to the resulting assembled item becoming
  # stock (Section 8.5, "Still open"). Unlike lead time, NO business figure exists at all for this
  # segment. Both values below are Modeler defaults only.
  # REVERTED 2026-09-23 (Phase J2, Part 0): Phase J Part 4 had changed this default from 3 to 7
  # days (the "robust upper bound" reasoning below, kept for the record, not deleted). That change
  # is now REVERTED back to 3 -- assembly_time_days=7 exceeds PEM101's 6-day median notice, making
  # component_stock_ato INFEASIBLE under METRICS.md Sec.15 for every item assembly_time_days
  # applies to, which silently removed all 36 of PEM101's component_stock_ato items from any
  # policy at all (METRICS.md Sec.15's own addendum now names this state explicitly --
  # component_stock_ato_infeasible -- instead of leaving it undefined, but the underlying
  # infeasibility is real, not a labelling problem). Phase J's calibration finding (the model fails
  # against actual delivery performance -- STATUS.md Phase J entry) means assembly time may not
  # even be the binding constraint on real fulfilment at all (see Phase J2's Explorer findings) --
  # so moving it to a stress-test upper bound is deferred until the real fulfilment mechanism is
  # known, rather than compounding an uncalibrated model with a further speculative change.
  # ROBUST-UPPER-BOUND REASONING, KEPT FOR THE RECORD (Phase J Part 4, 2026-09-23, NOW REVERTED):
  # CHANGED from 3 to 7 days -- the upper end of the plausible [3,7] range this Modeler proposed --
  # under-provisioning costs more than over-provisioning against a 6-day median order notice, and
  # Phase I found assembly time DECISION-RELEVANT in PEM101 (flips policy for 72 items at 7 days)
  # and PEM103 (relevant at 10%); PEM107 was insensitive at 10%. KNOWN CONSEQUENCE at the time (not
  # silently absorbed then either): PEM101's median customer notice is 6 days, so assembly_time_
  # days=7 > 6 tripped METRICS.md Sec.15's own documented structural gap -- exactly the problem
  # this revert now undoes.
  assembly_time_days_default: 3
  assembly_time_days_alternative: 7
  assembly_time_days_owner: "Modeler default -- business has not supplied this figure (STATUS.md Section 8.1/8.5). 3 days (REVERTED default, Phase J2 Part 0, 2026-09-23) is a small, defensible placeholder for simple sub-assembly of a fuse cutout/surge arrester from purchased parts, and keeps component_stock_ato FEASIBLE under METRICS.md Sec.15 for PEM101 (median notice 6 days). 7 days (alternative -- was briefly the default under Phase J Part 4, reverted) represents a more conservative, multi-step assembly, but makes component_stock_ato infeasible for PEM101 specifically. NEITHER is derived from data -- both are stated guesses pending a real production-time figure. The robust-upper-bound change is deferred, project-wide, until the real fulfilment mechanism is known (Phase J2) -- assembly time may not be the binding constraint at all."
  assembly_time_sensitivity_days: [1, 3, 5, 7, 10]   # E1.1 component-stock feasibility sensitivity table only

  # --- Review interval (periodic-review policy interval). No data source addresses this at all
  # (not even asked of the business) -- a pure Modeler default, chosen to match this project's
  # monthly forecast/data granularity (a review interval shorter than one month could not be
  # evaluated against monthly-aggregated data without inventing sub-monthly demand).
  review_interval_days_default: 30
  review_interval_days_owner: "Modeler default -- matches monthly data granularity; no business figure exists"

  # --- Cycle service level: STATUS.md Section 8.5, "Target service level ... not yet set. Phase 4
  # will present several levels for the business to choose from" -- this grid is exactly that.
  # NOTE, stated here so every downstream script/report repeats it: cycle service level (the
  # probability of NOT stocking out during one replenishment cycle) is NOT the same statistic as
  # unit fill rate (the % of demand UNITS delivered on time) -- see phaseE1_maxmin_scenario_report.md
  # and phaseE1_historical_simulation_report.md, which report both separately wherever computable.
  cycle_service_level_grid: [0.90, 0.95, 0.98]
  cycle_service_level_owner: "business must choose -- STATUS.md Section 8.5. 95% is used only as the DEFAULT SCENARIO's reference point below, not a business decision."

  # --- Default scenario: ONE specific combination from the 3x2x3=18-point grid above, needed as a
  # single reference point for the acceptance criteria and for the Validator (task instruction).
  # Picked as the middle/most-typical value on every dimension, not tuned to pass any criterion.
  default_scenario:
    procurement_lead_time_days: 60
    assembly_time_days: 3
    cycle_service_level: 0.95
    reason: "REVERTED 2026-09-23 (Phase J2, Part 0): assembly_time_days back to 3 (see assembly_time_days_owner above for the full reasoning -- 7 made component_stock_ato infeasible for all 36 of PEM101's items under it, and Phase J found the whole model uncalibrated against actual delivery performance, so a further speculative robust-upper-bound change is deferred, not compounded). procurement_lead_time_days stays 60 (was already the confirmed range's upper bound, not just its middle -- unaffected by this revert)."
    superseded_reason_2026_09_23_phaseJ_part4: "ROBUST DEFAULTS (Phase J Part 4, 2026-09-23, NOW REVERTED by Phase J2 Part 0 -- see `reason` above): both were set to the UPPER BOUND of their confirmed/plausible range, not the middle -- under-provisioning costs more than over-provisioning against a 6-day median customer order notice (STATUS.md Business Findings), and Phase I (output/summary/phaseI_report.md) found BOTH decision-relevant (procurement lead time in every division; assembly time in PEM101/PEM103). cycle_service_level was left unchanged (still the middle of 90/95/98) and still is."
    prior_reason_2026_09_18: "Middle value of the lead-time grid (60 of 45/60/75), the Modeler DEFAULT (not the alternative) assembly-time assumption (which was 3 at the time), and the middle value of the service-level grid (95% of 90/95/98) -- the single most 'typical' combination on every axis, not selected to produce a favourable acceptance-criteria result."

  # --- Replenishment quantity convention (Max = Min + replenishment qty). No MOQ or lot size
  # exists in this data -- confirmed ABSENT by the business (STATUS.md Section 8.3: "business
  # confirmed this data does not exist. Phase 4 must be designed without it"). Using the review
  # interval's own expected demand as the replenishment quantity is a REASONABLE CONVENTION, not a
  # derived fact -- a different convention (e.g. a fixed round-number lot) would give a different Max.
  replenishment_qty_convention: "review_interval_expected_demand"
  replenishment_qty_owner: "Modeler default -- STATUS.md Section 8.3 confirms no MOQ/lot-size data exists to use instead"

  # --- Safety stock convention: safety stock = (chosen percentile of the empirical protection-
  # period demand distribution) MINUS LTD (the forecast-based point estimate, METRICS.md sec.3)
  # -- METRICS.md sec.4's literal formula. CORRECTED 2026-09-22 (Phase E1-fix-2, Part 2): this
  # entry previously read "percentile_value_minus_distribution_mean" and claimed that was
  # "algebraically identical" to percentile-minus-LTD -- it is NOT. The two differ whenever the
  # forecast (LTD) and the empirical distribution's own historical mean disagree, which is a
  # confirmed code defect this correction fixes, not a modelling choice (see STATUS.md, Phase
  # E1-fix Part 2, and src/phaseE1fix_recompute.py's compute_safety_stock()). Min = LTD + safety
  # stock, i.e. Min = the percentile value directly only when LTD == distribution mean.
  safety_stock_convention: "percentile_value_minus_LTD"

  # --- Sellable warehouse codes: sellability was NEVER confirmed by any field in this database
  # (Phase D headline: 0.00% confirmed sellable, 99.90% undetermined -- no sellability/status/stage
  # column exists anywhere).
  #
  # STANDING ASSUMPTION, applies to EVERY division listed below, PEM101 included (recorded
  # 2026-09-22, Phase E2 Part 1 -- not a new caveat for the divisions added this round only):
  # sellability of ANY warehouse code cannot be verified from this data, full stop. Verifying it
  # would require the REVERSE direction of the warehouse_roles table above -- given a shipped
  # sales order, which warehouse did it ship from -- and that direction DOES NOT EXIST in this
  # schema: no row in cube_Sale_APD (or any sales/order table checked in this project) carries a
  # warehouse field. `warehouse_roles` above answers "which division's items sit in this code"
  # (the item-to-warehouse direction); it does NOT and CANNOT answer "is this code where sellable
  # finished-goods stock is kept" (the item-to-*sale* direction), because that second direction
  # has no data to check it against. Every sellable_warehouse_codes list below -- FG01/FG21/WH21
  # for PEM101 exactly as much as the new PEM103/PEM107 entries -- is therefore a BUSINESS
  # ASSUMPTION standing in for a fact the data cannot supply, to be confirmed by the warehouse
  # team, never treated as verified. See STATUS.md's Phase E2 entry for the full account.
  #
  # Per-division picks (keyed by division, extended 2026-09-22 for Phase E2's PEM103/PEM107
  # pilot): PEM101 unchanged from Phase E1 (FG01/FG21/WH21, all EXCLUSIVE:PEM101 or
  # SHARED-but-PEM101-dominant per warehouse_roles above). PEM103 -> FG23 (the one code
  # warehouse_roles found EXCLUSIVE:PEM103, 43 units/11 items). PEM107 -> FG27, WH22, WH24, FG22
  # (all EXCLUSIVE:PEM107) plus the shared FG01 (PEM107 holds 361 units/10 items there too, per
  # warehouse_roles) -- per the E2 readiness finding
  # (output/summary/phaseE2_readiness_report.md). Divisions not yet given a list (CI101, PEM102,
  # PEM104) have too few stocked items for a confident sellable-set and are excluded from the E2
  # pilot, not silently defaulted to an empty or PEM101 list.
  sellable_warehouse_codes:
    PEM101: ["FG01", "FG21", "WH21"]
    PEM103: ["FG23"]
    PEM107: ["FG27", "WH22", "WH24", "FG22", "FG01"]
  sellable_warehouse_codes_owner: "business -- sellability itself was never confirmed by any field, for ANY division (Phase D; reaffirmed as a standing assumption 2026-09-22, Phase E2 Part 1). Every list here is the Modeler's best-available item-to-warehouse proxy (STATUS.md whmap_report.md, phaseE2_readiness_report.md), not a fact."

  # --- Unit cost basis: IDENTICAL methodology to Phase D Check 2 (cost/qty per row, median over
  # the trailing 12 months, most-recent-transaction fallback) -- reused for cross-phase
  # consistency, not re-derived. Which of the two computed bases is treated as PRIMARY is itself a
  # stated choice (Phase D's own reasoning: robust to one-off/outlier rows), carried forward here.
  unit_cost_basis: "median_last_12mo_cost_over_qty_per_row_with_most_recent_transaction_fallback"
  unit_cost_basis_owner: "Modeler default -- Phase D Check 2 methodology (docs/reports/summary/phaseD_check2_report.md), reused for consistency across phases"
  unit_cost_median_window_months: 12

  # --- Obsolescence threshold: "no demand for N consecutive months." No business figure exists.
  # 6 months is chosen to match this project's own existing HOLDOUT/backtest scale
  # (src/backtest_rekeyed.py HOLDOUT=6) and because it exceeds every default-scenario protection
  # period computed in this phase (3-4 months) -- a working definition of "sitting idle longer
  # than one full replenishment cycle," not a derived or business-confirmed value.
  obsolescence_threshold_months: 6
  obsolescence_threshold_owner: "Modeler default -- no business figure exists"

  # --- Annual holding cost rate (E1-fix, forecast/inventory.html Tier A control). STATUS.md
  # records a 15-25% industry-standard figure but flags it explicitly as an UNVERIFIED assumption,
  # never sourced or used in a calculation (CONVENTIONS.md's unsourced-figure rule). 0.20 (the
  # midpoint of that unverified range) is used here as the Modeler default -- it is not a business
  # figure and not derived from this project's own data; holding_cost = stock_value x this rate.
  holding_cost_rate_annual: 0.20
  holding_cost_rate_annual_owner: "Modeler default -- STATUS.md's 15-25% figure is itself an unverified, unsourced industry-standard claim, not a business-confirmed rate for this company"

  # --- Historical simulation (E1.4) assumptions. No historical stock-movement/transaction-level
  # time series exists in this database (confirmed absent, Phase D / inventory investigations) --
  # so initial stock, receipt timing and fulfilment sequence CANNOT be read from data at all and
  # must be stated as explicit modelling choices, never treated as fact.
  simulation_initial_stock_assumption: "Each item's historical simulation starts 2024-01 with sellable on-hand stock equal to that SCENARIO's own computed Max (i.e. assume the business began the simulation window already stocked to the policy's own target Max level) -- a common inventory-simulation starting convention, not a historical fact (no 2024-01 stock figure exists in any table for this or any other starting assumption to be checked against)."
  simulation_initial_stock_owner: "Modeler default"
  simulation_receipt_timing_assumption: "A replenishment order arrives exactly ceil((procurement_lead_time_days + assembly_time_days) / 30.44) months after being placed, with NO variability (deterministic lead time). STATUS.md documents large REAL variability in internal handling time alone (item-level IQR often exceeds the median) that this simulation cannot capture without an actual stock-movement history, which does not exist."
  simulation_receipt_timing_owner: "Modeler default"
  simulation_fulfilment_sequence_assumption: "Within a simulated month: any replenishment receipt scheduled for that month is added to on-hand stock FIRST, then that month's demand is subtracted. Demand that exceeds available stock is BACKORDERED (carried forward and added to next month's demand) rather than treated as a lost sale -- consistent with STATUS.md's finding that demand in this data is not censored by stockouts (an order is recorded even when the business cannot fill it on time)."
  simulation_fulfilment_sequence_owner: "Modeler default"

  # --- Forecast consumption (E1.3): confirmed FUTURE-dated cube_Sale_APD MPS orders and overdue
  # Cube_Backlog rows are treated as KNOWN demand for a period; only the REMAINING (not yet
  # confirmed) portion of that period's statistical forecast is added on top -- never confirmed +
  # the full forecast (that would double count the confirmed portion).
  forecast_consumption_logic: "net_period_demand = confirmed_known_demand_for_period + max(0, statistical_forecast_for_period - confirmed_known_demand_for_period)"
  # Cube_Backlog and cube_Sale_APD are different tables with no verified shared key (STATUS.md,
  # Reserved/Available investigation chain) -- this project cannot confirm whether a given
  # Cube_Backlog row and a given cube_Sale_APD MPS row represent the SAME physical order. To avoid
  # a plausible double count, FUTURE-period confirmed demand is read from cube_Sale_APD MPS rows
  # ONLY (the same table the whole statistical demand series is built from); Cube_Backlog is used
  # ONLY for OVERDUE rows, added as immediate Period-1 demand per the task's own instruction --
  # the one place the two sources are combined, and only additively for the immediate period.
  backlog_vs_mps_double_count_note: "cannot be determined from data (no shared key between Cube_Backlog and cube_Sale_APD) -- resolved by the scope decision above, not by verification"

# ============================================================
# Report text (locked 2026-09-19) -- src/build_report.py renders forecast/sales_report.html
# from this block plus output/summary/*.csv. Every sentence below is a direct paraphrase of an
# existing STATUS.md finding, carrying that finding's own stated confidence level -- nothing new
# is claimed here. Edit this block by hand (a business-readable, non-technical audience) without
# touching src/build_report.py; the script re-reads it on every run.
# ============================================================
# Reader text below may hold {braced} names: src/build_report.py fills each at build time from data,
# config or a recorded output (src/reader_values.py), never from a typed number (CONVENTIONS.md
# "Dynamic values"). {intermittent_lumpy_share_pct}: METRICS.md Sec.29 classification of the forecast-
# status items; {first_scoring_month}: the forward-test log's first eligible date.
report:
  # Plain-language description of Top-down combination forecasting, for a non-technical reader.
  # Source: STATUS.md Locked Decisions, "Final forecasting method: Top-down combination".
  model_description: >-
    วิธีที่ใช้ประกอบด้วยสองส่วน Combination คือเฉลี่ยผลของโมเดลพยากรณ์ {n_base_models} แบบ
    (Naive, MA3, MA6, MA12, Croston, SBA) เพื่อทายยอดรวมของแต่ละ "Type" (กลุ่มสินค้าที่ขายในลักษณะเดียวกัน
    เช่น High Voltage Distribution Fuse Cutout) Top-down คือการแบ่งยอดทายของ Type นั้นลงสินค้าแต่ละรายการ (Item)
    ตามสัดส่วนยอดขายจริงในอดีตของสินค้านั้นเทียบกับยอดขายรวมของ Type ทั้งหมด

  # Source: STATUS.md Current Status Summary, "Phase 2 -- Model Selection" (high confidence).
  # Previous wording (kept off screen): no single model consistently beats the others at every
  # level (Category/Type/Item), and rule-based model selection (SBC, Kostenko-Hyndman,
  # Petropoulos-Kourentzes) is not significantly better than the Combination average, so
  # Combination was chosen as the safer approach (confidence: high).
  why_not_single_model: >-
    ไม่มีวิธีทายวิธีเดียวที่ชนะทุกกลุ่มสินค้า และการเลือกวิธีตามกฎทางวิชาการก็ไม่ได้ดีกว่าการเฉลี่ยหลายวิธี
    จึงใช้ค่าเฉลี่ย (Combination) ซึ่งเสี่ยงน้อยกว่าพึ่งวิธีเดียว

  # Source: STATUS.md Locked Decisions, "Model progression is Naive baseline, then Moving
  # Average, then Croston and SBA. TensorFlow and Prophet are excluded...".
  why_not_ml: >-
    ไม่ใช้ Neural Network (เช่น TensorFlow) หรือ Prophet เนื่องจากมีข้อมูลย้อนหลังเพียง {history_months} เดือน
    และ {intermittent_lumpy_share_pct}% ของรหัสสินค้ามีลักษณะการขายแบบ Intermittent หรือ Lumpy (ขายไม่สม่ำเสมอ ไม่ต่อเนื่อง)
    ทำให้ Neural Network มีความเสี่ยงสูงที่จะ Overfit กับข้อมูลจำนวนน้อย และ Prophet มีสมมติฐาน
    ว่าข้อมูลต่อเนื่อง (continuous) ซึ่งไม่ตรงกับลักษณะข้อมูลจริงของโครงการนี้

  # Each item a short, standing (not-yet-resolved) caveat, carrying its own stated confidence
  # level from STATUS.md -- not a resolved finding restated as fact.
  limitations:
    # Previous wording of the next four items is in git history (commit 1f87b6e); the on-screen
    # text below is the approved Thai wording, used verbatim.
    - "วันส่งตามสัญญาอาจถูกแก้หลังรับ PO ระบบไม่มีบันทึกการแก้ ตรวจแล้วกระทบประมาณ {forecast_date_revision_share_pct}% ของรายการ"
    - "ไม่มีข้อมูลประวัติของ Price List เวอร์ชันเก่า จึงไม่สามารถตรวจสอบได้ว่าการจัดฝ่าย/ประเภท
      สินค้าเคยเปลี่ยนแปลงไปจากอดีตหรือไม่ (cannot be determined จากข้อมูลที่มีอยู่ในปัจจุบัน)"
    - "ยอดขายนับจาก PO ที่ลูกค้าสั่งจริงเท่านั้น จึงไม่เห็นความต้องการที่ไม่ได้กลายเป็น PO เช่น ลูกค้าที่ไม่สั่งเพราะรู้ว่าไม่มีของ"
    # The significance sentence that stood here is replaced by the block in section 6, built from topdown_significance.csv.
    - "ไม่มีข้อมูลเวลาประกอบหลังได้ชิ้นส่วน ตัวเลขนี้ในการวางแผน stock เป็นค่าสมมติ"
    - "Min/Max ที่ตั้งอยู่ในระบบตอนนี้ใช้คำนวณไม่ได้ {n_no_minmax} จาก {n_scope_items} รายการไม่ได้ตั้ง และค่าที่มีไม่สอดคล้องกัน ใช้ได้แค่เป็นตัวเทียบ"
  # Standing next-step items, each pulled from an already-recorded open item in STATUS.md.
  next_steps:
    # The earlier next-step items (first forward-test scoring round, analogue codes for
    # placeholders, service-level definition, database password reset policy) are project-team
