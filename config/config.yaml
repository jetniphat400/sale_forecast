# ---- Week 3 classification additions (METRICS.md Sec.23, "Added 2026-10-06"; src/investigations/task2b_part2_fulfilment_segmentation.py) ----
# ASSUMPTIONS, set before the numbers were computed (the user's prompt of 2026-10-06). The Sec.23 thresholds themselves are unchanged.
week3_classification:
  # Delivered contracts are counted from this date (the analysis window of the Sec.23 label).
  analysis_window_start: "2024-01-01"
  # too_little_data: fewer than this many delivered contracts in the window; counts are also reported at the neighbouring values.
  min_delivered_contracts: 3
  min_delivered_contracts_report_at: [2, 3, 5]
  # Mixed item (Part 3): at least min_lines_each_kind delivered lines of each kind; the median days from createDate to ActualDelDate of the
  # MTS-labelled lines at most stock_median_days_max, of the MTO- or ETO-labelled lines above order_median_days_min; the two medians differ by
  # at least min_median_gap_days. The rule is not applied when it calls more than max_share_of_known_items of the known items mixed.
  mixed_rule:
    min_lines_each_kind: 3
    stock_median_days_max: 14
    order_median_days_min: 14
    min_median_gap_days: 7
    max_share_of_known_items: 0.10
    share_window_months: 12

# ---- Material plan v1 (week 3, 2026-10-06; METRICS.md Sec.43; src/material_plan.py) ----
# ASSUMPTIONS and thresholds, fixed before the proof tests were run (the prompt of 2026-10-06). Each is reported with its evidence in STATUS.md and DATA_MAP.md.
material_plan:
  # Warehouses that hold raw materials and components: the warehouses that issue to production (type B) for BOM components, over 12 months,
  # at least rm_warehouse_min_share of all those issues. The list is the result of the proof (src/material_plan.py rm_warehouse_proof); QA receives
  # purchases but does not issue to production and is not in it.
  rm_warehouse_min_share: 0.01
  # Result of the proof of 2026-10-06 (12 warehouses; each issues at least rm_warehouse_min_share of the 12 months' type B issues of BOM components).
  rm_warehouses: [W121, W124, W3-1, W3-2, W3-3, WH, WH21, WH22, WH23, WH24, WH26, WH27]
  # Open orders (Cube_tobe_received) are used when every proof criterion holds: lines matched to a purchase-order line, the open quantity equal to the
  # ordered minus the received quantity, the expected date equal to the PO planned date, and on received history the planned date within
  # open_orders_within_days of the first receipt for at least open_orders_min_share of lines.
  open_orders_min_match_share: 0.90
  open_orders_min_quantity_share: 0.90
  open_orders_min_date_share: 0.90
  open_orders_within_days: 14
  open_orders_min_share: 0.70
  open_orders_usable: true
  # BOM source: Cube_BOM_Exact, because it holds a line for more of the materials actually issued to production than Cube_BOM_Exact_V2 (STATUS.md week 3).
  bom_source: "Cube_BOM_Exact"
  # A component is an in-house sub-assembly (expanded) when it has its own BOM and no purchase record (a purchase order or a receipt) since the date below.
  purchase_evidence_since: "2022-01-01"
  max_bom_levels: 25
  # Lead time per material, the order of sources of METRICS.md Sec.5 (observed, supplier quoted, assumed); the assumed value is lead_time_v1.fallback_material_days.
  usable_lead_days: [0, 730]
  # Recorded outputs (untracked); their hashes go in the operation plan's integrity file under "material_plan".
  output_material_month_file: "output/summary/material_plan_v1_material_month.csv"
  output_material_summary_file: "output/summary/material_plan_v1_material_summary.csv"
  # The material plan page's first list: materials whose latest order date falls from the day of the plan to that day plus this many days (decided by the user, 2026-10-06).
  order_window_days: 30
  # Remarks on material lines (METRICS.md Sec.54). Every line stays in every table; a line is tagged when it is not goods. The rules are attribute values and keywords, never a list of codes.
  # (1) a PAID remark (ค่าแรง, ค่าจ้าง or ค่าบริการ: labor, subcontract or service charges bought by purchase order, not goods, not stocked): the line is NOT counted in the page's summary counts.
  # (2) the remark "รอตรวจ" (to be checked): the type is uncertain, the line IS counted until a person confirms it. A line matching both gets the paid remark.
  non_stock_rule:
    enabled: true
    attributes_file: output/data/material_pull/item_attributes.pkl      # the item master read-only with the material pull (Cube_ItemList, Cube_Inventory_Aging, Cube_Inventory_Exact, cube_inventory_tran)
    paid_remark_order: ["ค่าแรง", "ค่าจ้าง", "ค่าบริการ"]                  # the first remark in this order whose keyword is found in the description (then in the code) is the line's remark
    paid_remarks:                                                        # the first remark whose keyword is found in the description (then in the code) is the line's remark
      ค่าแรง: ["ค่าแรง", "LABOR"]
      ค่าจ้าง: ["ค่าจ้าง", "จ้าง"]
      ค่าบริการ: ["ค่าบริการ", "ค่า บริการ", "ค่าขนส่ง", "LOGISTICS COST", "SERVICE"]
    pending_review:                                                      # remark รอตรวจ for a line with no keyword match that has any of these
      item_group: ["2000", "400", "4012"]                                # Cube_ItemList.ItemGroup (the group the item master gives to labor and processing charges)
      no_master_record: true                                             # the item master (and the stock record) has no row for the item
      service_units: ["HOUR", "JOB", "LOT"]                              # a unit of measure that names work, not a thing
    pending_label: "รอตรวจ"
    evidence_labels: {name: "จากชื่อ", code: "จากรหัส", item_group: "จากกลุ่มสินค้า", no_master: "ไม่มีข้อมูลในระบบ", unit: "หน่วยนับ", reviewed: "จากการตรวจชื่อ"}
    exceptions:                                                          # a line moved to รอตรวจ by a review of its name (Validator, 2026-10-09): code: one-line reason (no description)
      LABOR-RS-R-06-0006: "the name reads like a physical part; only the LABOR- code prefix marks it"
      LABOR-RS-R-06-0025: "the name reads like a physical part; only the LABOR- code prefix marks it"
      LABOR-03-CC-R-1046: "the name is unclear: outsource wording beside a product name"
      LABOR-RS-R-06-0017: "the name is unclear: a process and a material name, no fee word"
      LABOR_TF-R-09-0027: "no description in the item names; only the LABOR_ code prefix marks it"
  # Items shown in the "used in" column (the finished goods that need most of the material).
  used_in_max_items: 3

# ---- Lead time per item, version 1 (week 1, item 1.3; METRICS.md Sec.5; src/lead_time_v1.py) ----
# item lead time = slowest material's lead time + the item's production time. One statistic everywhere: the median.
lead_time_v1:
  # ASSUMPTION. Used for a material with no observed purchase record and no non-zero supplier-quoted delivery time. Set at the observed 90th
  # percentile across materials (the per-material median order-to-first-receipt days of the 138 of 228 BOM materials of PEM101's 92 stock items
  # that have purchase records: p90 63.2, 2026-10-05, docs/reports/summary/week1_leadtime_calibration.md). To be tuned later.
  fallback_material_days: 63
  # ASSUMPTION. Production time (days from Cube_Production_Order.start_date to the latest cube_final.final_date of the same job) for an item with
  # fewer than production_min_jobs matched jobs, and for an item with no usable BOM. Set at the median over all 291 matched job-items since
  # 2023-01-01 (26 days). Cube_Standard_Time is not production time (it is the raw-material incoming-inspection plan) and is not used.
  production_days_assumed: 26
  # An item's own median is used when it has at least this many matched jobs (tested leave-one-job-out: item median MAE 21.4 days against 29.1
  # for the global median, 19 items, 71 jobs).
  production_min_jobs: 3

# ---- Max-Min v1 for PEM101 (week 1, decision D2 of 2026-10-05; METRICS.md Sec.5, 20, 22; src/maxmin_v1.py) ----
# Min/Max use the lead time the calibration supports: the ensemble fitted with lead time free on the 92 stock_policy items (the control run of
# src/investigations/week1_recalibration.py). The per-item material lead time is shown and kept for the week 3 material plan, not used for Min/Max.
maxmin_v1:
  # The observation window of the PEM101 calibration (decision D4, 2026-10-06: the J3 window, METRICS.md Sec.20). Equal to CALIBRATION_START and
  # CALIBRATION_END of src/investigations/phaseJ3_calibration_engine.py (a test checks it). Year-month, inclusive.
  calibration_window: {start: "2024-01", end: "2025-12"}
  # The control run's recorded files (output/summary), with their hashes in week1_recal_integrity.json.
  ensemble_integrity_file: "output/summary/week1_recal_integrity.json"
  ensemble_members_file: "output/summary/week1_recal_control_members_PEM101_92.csv"
  ensemble_tradeoff_points_file: "output/summary/week1_recal_control_tradeoff_points_PEM101_92.csv"
  ensemble_tradeoff_envelope_file: "output/summary/week1_recal_control_tradeoff_envelope_PEM101_92.csv"
  ensemble_targets_file: "output/summary/week1_recal_targets.json"
  ensemble_stock_items_file: "output/data/lead_time_inputs/stock92.json"
  ensemble_raw_sales_file: "output/data/raw_all_divisions_sales.csv"
  # The page's inputs, built from the files above by src/maxmin_v1.py and recorded with a SHA-256.
  dense_grid_file: "output/summary/maxmin_v1_dense_grid_PEM101.json"
  ratio_grid_file: "output/summary/maxmin_v1_ratio_grid_PEM101.json"
  recorded_outputs_integrity_file: "output/summary/maxmin_v1_integrity.json"
  # Min and Max on the stock share of the 13 mixed items, computed only (week 4); one JSON file that carries the SHA-256 of its own content.
  mixed_item_min_max_file: "output/summary/mixed_item_min_max_v1.json"
  # Per-item lead time (METRICS.md Sec.5, item lead time version 1) and its integrity file.
  item_lead_time_file: "output/summary/item_lead_time_v1.csv"
  item_lead_time_integrity_file: "output/summary/item_lead_time_v1_integrity.json"
  # The in-use assumptions the Assumptions tab of index.html reads at runtime (a contract for a later app, DATA_MAP.md).
  assumptions_file: "data/assumptions.json"
  # Source of a material's value (src/lead_time_v1.py) -> the label the page shows (approved text of 2026-10-05).
  material_source_labels:
    observed: "ใบสั่งซื้อจริง"
    supplier_quoted: "ผู้ขายแจ้ง"
    assumed: "ค่าประมาณ"
  # The assumptions in use (week 1, approved text of 2026-10-05, used verbatim). Braces name values the builder (src/maxmin_v1.py) computes from
  # recorded outputs and config; value_source says where each comes from (never shown on a page).
  # The table "เกณฑ์ที่รอกำหนด" of the assumptions tab (data/assumptions.json, key pending_criteria): criteria nobody has set yet, with the draft the project shows.
  # DRAFT values, pending the user (decision of 2026-10-08); nothing passes or fails against them yet. Sources:
  #   relative_mae_pass 1 and relative_mae_good 0.7: Morlidge's ratio of forecast MAE to naive MAE (Gilliland / SAS, "The avoidability of forecast error, Part 4"): a forecast
  #   no better than the naive one (ratio 1) adds nothing. The measure is Relative MAE = MAE of our forecast / MAE of Naive on the same items, months and horizons (METRICS.md Sec.48).
  #   tracking_signal_limit 4: the common tracking-signal control limit (APICS / CPIM practice).
  #   decision_date: the criteria are decided after the 2026-12-05 run (the run after the first forward results).
  pending_criteria_values: {relative_mae_pass: 1, relative_mae_good: 0.7, tracking_signal_limit: 4, decision_date: "2026-12-05"}
  # Approved text of 2026-10-08 (verbatim); {braces} are filled from pending_criteria_values (the date with the shared Thai date formatter).
  pending_criteria_rows:
    - {topic: "ยอดทายดีกว่าวิธีง่ายไหม", to_decide: "Relative MAE ต่ำแค่ไหนถึงนับว่าถึงเกณฑ์ (MAE ของเรา ÷ MAE ของ Naive)", now_used: "ร่าง: ต่ำกว่า {relative_mae_pass} ถึงเกณฑ์ผ่าน, ต่ำกว่า {relative_mae_good} ถึงเกณฑ์ดี", who: "ผู้บริหาร", when: "หลังรอบ {decision_date}"}
    - {topic: "ยอดทายเอียงต่อเนื่อง", to_decide: "tracking signal เกินเท่าไหร่ถึงเตือน", now_used: "ร่าง: ±{tracking_signal_limit}", who: "ผู้บริหาร", when: "ทุกเดือน"}
    - {topic: "ฝ่ายที่ยอดทายไม่ชนะวิธีง่าย", to_decide: "ใช้วิธีง่ายแทนไหม", now_used: "ยังใช้วิธีเดิม และแสดงผลเทียบ", who: "ผู้บริหาร", when: "หลังรอบ {decision_date}"}
    - {topic: "เป้าการส่งไม่สาย", to_decide: "บริษัทต้องการกี่ %", now_used: "ให้เลือกเองบนหน้าแผนสต็อก", who: "ผู้บริหาร", when: "ยังไม่กำหนด"}
    - {topic: "Min/Max ที่จำลอง", to_decide: "การส่งไม่สายจำลองห่างจากผลจริงได้แค่ไหน", now_used: "ยังไม่กำหนด", who: "ฝ่ายวางแผน", when: "หลังรอบ {decision_date}"}
    - {topic: "แผนวัตถุดิบ", to_decide: "ตรงกับใบสั่งซื้อจริงแค่ไหนถึงใช้สั่งของได้", now_used: "ยังไม่กำหนด หน้าขึ้นว่ายังอยู่ระหว่างตรวจสอบ", who: "ฝ่ายจัดซื้อ", when: "ยังไม่กำหนด"}
    - {topic: "เป้ารายได้", to_decide: "นับจากวันออก invoice หรือวันส่งของ", now_used: "ใช้วันส่งของไปก่อน", who: "เจ้าของเป้า", when: "ยังไม่กำหนด"}
    - {topic: "จับคู่ประเภทสินค้ากับเป้า", to_decide: "ยืนยันการจับคู่ที่จับจากชื่อ เช่น MV/HV Surge Arrester", now_used: "แสดงพร้อมป้ายยังไม่ยืนยัน", who: "ฝ่ายขาย", when: "ยังไม่กำหนด"}
  assumptions:
    - id: minmax_lead_time
      topic: "lead time ที่ใช้คำนวณ Min/Max"
      unknown: "ได้จากการจำลองให้ตรงผลจริง ไม่ได้วัดตรง"
      used_now: "{lead_min}-{lead_max} วัน"
      affects: "Min/Max ของ PEM101"
      value_source: "lead_time_days over the distinct members of the lead-time-free calibration, minimum and maximum (output/summary/week1_recal_control_members_PEM101_92.csv)"
    - id: production_time
      topic: "เวลาผลิตสินค้า"
      unknown: "ระบบไม่บันทึกวันเริ่มผลิตจริง"
      used_now: "{assumed_production_days} วัน ({n_assumed_production} รายการ)"
      affects: "แผนสั่งวัตถุดิบ"
      value_source: "production_days and production_source of the items with source assumed (output/summary/item_lead_time_v1.csv)"
    - id: material_without_purchase_history
      topic: "วัตถุดิบที่ไม่มีประวัติสั่งซื้อ"
      unknown: "ไม่มีใบสั่งซื้อในระบบ"
      used_now: "เวลาที่ผู้ขายแจ้ง หรือค่าสูงของวัตถุดิบอื่น"
      affects: "แผนสั่งวัตถุดิบ"
      value_source: "METRICS.md Sec.5 item lead time version 1: supplier-quoted delivery time, else config lead_time_v1.fallback_material_days"
    - id: sellable_warehouses
      topic: "คลังที่นับว่าขายได้"
      unknown: "ประวัติการเคลื่อนไหวของคลังไม่พอ"
      used_now: "{sellable_warehouses}"
      affects: "stock ที่ใช้เทียบกับ Min"
      value_source: "config phase_e1_assumptions.sellable_warehouse_codes.PEM101"
    - id: pem101_undetermined_items
      topic: "สินค้า PEM101 {n_undetermined} รหัส"
      unknown: "ยังไม่ชัดว่าเก็บ stock หรือผลิตตามสั่ง"
      used_now: "ไม่มี Min/Max"
      affects: "Min/Max"
      value_source: "items of class conflict under METRICS.md Sec.23 after config fulfilment_class_decisions (output/summary/task2b_part2_item_level.csv)"
    - id: production_capacity
      topic: "กำลังผลิต"
      unknown: "ข้อมูลบอกได้แค่ยอดผลิตสูงสุดที่เคยทำ"
      used_now: "ใช้ยอดนั้นเป็นค่าต่ำสุด"
      affects: "แผนการผลิต"
      value_source: "STATUS.md, Q20: the highest sustained monthly output per division and Type, a lower bound"
    - id: open_production_orders
      topic: "ใบสั่งผลิตที่กำลังทำ"
      unknown: "วันกำหนดเสร็จในระบบไม่ตรงกับวันเสร็จจริง"
      used_now: "ไม่นับในแผน"
      affects: "แผนการผลิต"
      value_source: "config operation_plan.open_orders_usable (false) and output/summary/week2_open_orders_test.json: the planned finish does not hold and no way of telling an open order passed"
    - id: fmto_fmts_warehouses
      topic: "คลัง FMTO และ FMTS"
      unknown: "ยังไม่รู้ว่าเป็นของพร้อมขายไหม"
      used_now: "ไม่นับ"
      affects: "stock ที่ใช้เทียบกับ Min และแผนการผลิต"
      value_source: "config phase_e1_assumptions.sellable_warehouse_codes does not list FMTO or FMTS; week 2 October decomposition (STATUS.md): 4,054 units of the items below Min"
    - id: forecast_range
      topic: "ยอดทาย"
      unknown: "ยังไม่มีช่วงสูง-ต่ำ"
      used_now: "ใช้ค่ากลาง"
      affects: "แผนการผลิต"
      value_source: "the forward-test log holds one forecast per item and month (METRICS.md Sec.27), no interval"
    - id: calibration_window
      topic: "ช่วงข้อมูลที่ใช้ปรับ Min/Max"
      unknown: "ถ้าใช้ช่วงสั้นลง lead time ที่ได้จะแคบลง"
      used_now: "{calibration_window}"
      affects: "Min/Max ของ PEM101"
      value_source: "config maxmin_v1.calibration_window (decision D4, 2026-10-06; the J3 window); the shorter window is the sensitivity in docs/reports/summary/week1_leadtime_calibration.md"

# ---- Operation plan v1 (week 2, 2026-10-06; METRICS.md Sec.42; src/operation_plan.py) ----
# D4 (the user, 2026-10-06): the PEM101 calibration keeps the J3 observation window, 2024-01 to 2025-12 (METRICS.md Sec.20). The shorter window
# (target from 2024-07) gives lead 1 to 15 days with 35 members (week1_leadtime_calibration.md); it is a sensitivity for the week 4 review, not used.
operation_plan:
  # Week 3 (2026-10-06): all six divisions, in the order the pages show them.
  divisions: [PEM101, PEM103, PEM107, PEM102, PEM104, CI101]
  # The recorded reason a division has no forecast item (the page says it in its own words): made_to_order = the division is made to order by business model, so no
  # stock policy applies and no sales forecast is made (business-confirmed 2026-09-23; DATA_MAP.md, Locked Decisions "Exclusion -- PEM104"; this supersedes the older
  # "insufficient data" reason, which was a symptom). A division with no forecast item and no entry here keeps the line that says it has no stock item.
  exclusion_reasons:
    PEM104: made_to_order
  # Only these divisions have a Min and Max (read from the inventory page); every other item's load equals its demand.
  divisions_min_max_from_page: [PEM101, PEM107]
  # The Sec.23 item-level file: class, display label and flags per item of the six divisions (output/summary, untracked).
  item_class_file: "output/summary/task2b_part2_item_level.csv"
  # The item status file of phase C: codes whose status starts with never_sold_prefix are listed in the price list but never sold; they are not in the plan and
  # the page says how many per division.
  item_status_file: "output/summary/phaseC_step1revised_item_status_445.csv"
  never_sold_prefix: "excluded - listed but never sold"
  # The material plan's inputs (one pickle of DataFrames, written by the monthly runner's pull stage `src/material_plan.py --pull`, which also saves class_evidence.pkl
  # beside it): the CES backlog with RevenueType, the BOM tree, raw-material stock, open orders, purchase history, price list, item names. The one-off file of
  # week 3 (output/data/week3_inputs) is no longer read.
  week3_inputs_file: "output/data/material_pull/material_inputs.pkl"
  # PEM103 counts only its Omni Channel orders (the approved page line states it); the backlog rows of its items with another RevenueType are dropped.
  backlog_channel_scope: {PEM103: "Omni Channel"}
  # Classes of METRICS.md Sec.23 that get a Min and Max (part A) and that do not (part B, load equals demand).
  classes_with_min_max: [stock_policy]
  classes_without_min_max: [confirmed_to_order, conflict]
  # Month index of the plan: the vintage's target months from the current month onward (METRICS.md Sec.27, latest vintage, Item level).
  forecast_log_file: "output/summary/forward_test_log_all_divisions.csv"
  forecast_log_metadata_file: "output/summary/forward_test_log_all_divisions_metadata.json"
  forecast_level: "Item"
  # The page whose embedded data holds each item's Min and Max as shown on load (forecast/inventory.html, built by step 7 of the runner).
  inventory_page_file: "forecast/inventory.html"
  # Stock: the latest daily stock pull. Backlog: the latest saved pull of either kind (the larger pulled_at_local in pull_meta.json).
  stock_pull_dir: "output/data/daily_stock_pull"
  backlog_pull_dirs: ["output/data/daily_stock_pull", "output/data/inventory_pull"]
  # Cube_CES Status = 'Backlog': confirmed quantity = ActualQty + BacklogQty (DATA_MAP.md, same convention as build_inventory_dataset.py).
  # ASSUMPTION. Open production orders are NOT counted (Part 1 test, output/summary/week2_open_orders_test.json): no column marks an order
  # still to be produced. The simulation adds open orders when this is true and a file of them is given; it is false until a test shows they can be used.
  open_orders_usable: false
  open_orders_test_file: "output/summary/week2_open_orders_test.json"
  # Capacity reference: the highest sustained monthly output per division, METRICS.md Sec.42 (the method of DATA_MAP.md, cube_final entry).
  capacity:
    cube_final_file: "output/data/lead_time_inputs/cube_final_all.csv"
    item_division_file: "output/summary/phase24_explorerC_item_type_division_map.csv"
    date_column: final_date
    quantity_column: transfer_qty
    # A top month at least this many times the next-highest is an isolated spike and is passed over (DATA_MAP.md: "no top-5 month more than ~2x the next").
    spike_ratio: 2.0
    # Figures DATA_MAP.md records for the same method (cube_final entry, "Highest sustained monthly output"); the recomputation must equal them.
    data_map_reference: {PEM101: 249080, PEM107: 6221}
    # Week 3: items the item-division file above does not hold take their price-list division when it is one of these (CI101 and PEM102 are not in the file).
    extra_divisions: [CI101, PEM102]
  # Part 1 test (src/investigations/week2_open_orders_test.py): open production orders are used in the plan only if every criterion holds.
  # Thresholds are ASSUMPTIONS, stated before the test was run. A finished order is a job and item with a cube_final record.
  open_orders_test:
    plan_row_inputs_dir: "output/data/week2_inputs"
    prodorder_file: "prodorder_20261006.csv"
    cube_final_file: "cube_final_20261006.csv"
    earlier_prodorder_file: "output/data/lead_time_inputs/prodorder_all.csv"
    # C1 planned finish: share of finished orders with the final record within this many days of the planned finish must be at least min_share_within.
    finish_within_days: 14
    min_share_within: 0.70
    # C2 open by status (status open or Released): the share of those orders already past their planned finish by more than stale_days must be at most this.
    stale_days: 30
    max_stale_open_share: 0.20
    # C3 open by missing final record: among orders past their planned finish by more than coverage_overdue_days (so they should be finished), the share
    # that has a final record must be at least min_final_coverage, or a missing record cannot mean the order is open.
    coverage_overdue_days: 60
    min_final_coverage: 0.70
    open_statuses: [open, Released]
    # C2b (added after the first run showed that rows with to_be_realized = 0 behave as receipts; threshold set before it was computed): open by receipts,
    # an order is closed when the quantity of its zero-remaining rows reaches the planned quantity. Finished orders must show that at least this share.
    min_finished_closed_share: 0.70
  # Where the recorded outputs go (output/ is untracked) and the file of hashes.
  output_item_month_file: "output/summary/operation_plan_v1_item_month.csv"
  output_division_month_file: "output/summary/operation_plan_v1_division_month.csv"
  output_meta_file: "output/summary/operation_plan_v1_meta.json"
  output_integrity_file: "output/summary/operation_plan_v1_integrity.json"
  # Float tolerance for the Min comparison, in units.
  tolerance_units: 1.0e-9
